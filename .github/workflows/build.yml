name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure native application
        run: cmake -S . -B build/native -A x64
      - name: Build
        run: cmake --build build/native --config Release --parallel
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Build bundled Quick Settings integration
        shell: pwsh
        run: ./tools/prepare-integration.ps1 -Destination build/native/Release/integration
      - name: Package portable application and sources
        shell: pwsh
        run: ./tools/package.ps1 -BuildDirectory build/native/Release
      - name: Build per-user installer
        shell: pwsh
        run: |
          ./tools/setup-inno.ps1
          ./tools/build-installer.ps1 -BuildDirectory build/native/Release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CursorBrightness-windows-x64
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: CursorBrightness-windows-x64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
